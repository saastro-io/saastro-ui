name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # No version: action-setup reads pnpm from package.json#packageManager (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      # @saastro-io/{config,shell,docs-theme} live in GitHub Packages (private).
      # The repo .npmrc only points the scope at the registry; the token is
      # injected here so nothing authenticated is committed.
      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Sin `publish:` a propósito: este repo no publica ningún paquete a npm.
      # @saastro/ui-registry es private (los bloques se consumen copy-in vía el
      # CLI de shadcn contra ui.saastro.io) y `changeset publish` se salta los
      # private EN SILENCIO — el publish era un no-op que además fallaba el
      # workflow en cada push a main. Mismo patrón que saastro-forms.
      - name: Create Release Pull Request (no publish)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
