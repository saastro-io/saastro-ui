name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # No version: action-setup reads pnpm from package.json#packageManager (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      # @saastro-io/{config,shell,docs-theme} live in GitHub Packages (private).
      # The repo .npmrc only points the scope at the registry; the token is
      # injected here so nothing authenticated is committed.
      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Valida el registry construido antes de que llegue a ui.saastro.io:
      # nombres duplicados, rutas rotas, errores de schema. Es el único gate
      # que ve los 17 JSON que sirve el sitio — el build sólo los escribe.
      - name: Validate registry
        run: pnpm dlx shadcn@4.18.0 registry validate
        working-directory: packages/ui-registry
