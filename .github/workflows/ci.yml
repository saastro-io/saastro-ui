name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # No version: action-setup reads pnpm from package.json#packageManager (single source of truth).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      # @saastro-io/{config,shell,docs-theme} live in GitHub Packages (private).
      # The repo .npmrc only points the scope at the registry; the token is
      # injected here so nothing authenticated is committed.
      - name: Authenticate GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - run: pnpm install --frozen-lockfile

      # La vista `knowledge/` de la raíz son symlinks a los knowledge de cada
      # workspace (doctrina de la oficina §1). `office watch` lee de esa carpeta
      # plana, pero la ficha vive junto al código. Si alguien añade una sección y
      # no relinka, la office deja de verla EN SILENCIO — de ahí el gate.
      - name: Verify office knowledge links
        run: pnpm run office:check

      # Tests de comportamiento de los primitivos (vitest + jsdom). El primero,
      # el foco de teclado del Calendar: sin él, un ref que no llega al
      # <button> pasa build, capturas y validate sin que nada lo vea.
      - name: Registry tests
        run: pnpm --filter @saastro/ui-registry test

      - run: pnpm run build

      # Valida el registry construido antes de que llegue a ui.saastro.io:
      # nombres duplicados, rutas rotas, errores de schema. Es el único gate
      # que ve los 17 JSON que sirve el sitio — el build sólo los escribe.
      - name: Verify registry output
        run: |
          test -f apps/ui-docs/dist/r/registry.json \
            || { echo "::error::apps/ui-docs/dist/r/registry.json no existe — el build del registry no corrió antes que el del sitio"; exit 1; }

      # Que cada item tenga sus dos PNG y que no sean más viejos que su fuente
      # (hash en public/previews/fuentes.json, que escribe `pnpm capture`).
      - name: Verify previews
        run: node apps/ui-docs/scripts/check-previews.mjs

      # El gate de arriba comprueba que los PNG EXISTAN y estén al día, no que la preview
      # funcione: el 6-sep-2026 /preview/dropdown-menu y /preview/progress
      # llevaban rotas en producción con sus cuatro capturas presentes y CI en
      # verde (la captura fotografía el menú cerrado). Éste las abre y las pulsa.
      - name: Install Chrome for the preview check
        run: pnpm exec puppeteer browsers install chrome-headless-shell
        working-directory: apps/ui-docs

      - name: Previews actually render
        run: pnpm run comprobar:previews
        working-directory: apps/ui-docs

      - name: Validate registry
        run: pnpm dlx shadcn@4.18.0 registry validate
        working-directory: packages/ui-registry
