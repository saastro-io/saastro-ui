# pnpm workspace config — replaces the "workspaces" field the root
# package.json used under Bun. Same globs, so resolution is identical.
packages:
  - "packages/*"
  - "apps/*"

# The only two deps in the graph that declare install/postinstall scripts.
# pnpm 10 blocks build scripts by default; both are trusted and ship
# platform binaries, so we allow-list them explicitly.
# (Locally the global ~/.npmrc `ignore-scripts=true` still wins — this is
# what makes CI / CF Pages builds run them.)
onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp

# Parches de seguridad para dependencias TRANSITIVAS (Dependabot, oct-2026).
# Cada selector va acotado por arriba y por abajo al tramo vulnerable, y el
# destino es un caret dentro de la MISMA mayor: ninguno cruza de mayor. Ninguno
# toca dependencias que los bloques del registry declaren (`@base-ui/react`,
# `lucide-react`…): todo es tooling de build/test/docs.
overrides:
  "proxy-addr@>=2.0.0 <2.0.8": ^2.0.8
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ^1.31.0
  "undici@>=7.0.0 <7.29.1": ^7.29.1
  "brace-expansion@>=1.0.0 <1.1.21": ^1.1.21
  "brace-expansion@>=5.0.0 <5.0.12": ^5.0.12
  "devalue@>=5.0.0 <5.9.3": ^5.9.3
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  "sharp@>=0.35.0 <0.35.5": ^0.35.5
  "fast-uri@>=3.0.0 <3.1.8": ^3.1.8
  "ip-address@>=10.0.0 <10.7.1": ^10.7.1
  "smol-toml@>=1.0.0 <1.9.0": ^1.9.0
  # vite 7 lo trae @astrojs/react 5 (vite ^7.3.2), y ninguna 5.x pide ya
  # >=7.3.7 (GHSA-587h-7wmj-h5pm, alta). Subir a @astrojs/react 7 es cambio
  # de mayor; el parche está dentro de la 7.
  "vite@>=7.0.0 <7.3.7": ^7.3.7
  # zod 4.6.1 lo trae @astrojs/sitemap (GHSA-mrhx-c7xc-m3w5, alta, 24-oct).
  "zod@>=4.0.0 <4.6.6": ^4.6.7

# Cuarentena de versiones recién publicadas (seguridad, doc 78; modelo
# saastro-io/saastro-office#507). Un paquete secuestrado se publica y se
# retira en horas o días: con 10080 min (7 días) pnpm no resuelve ninguna
# versión más nueva que eso y cae en la anterior. Nuestros paquetes
# (`@saastro-io/*`, de GitHub Packages) se consumen el mismo día que se
# publican, y por eso van exentos.
#
# Parche urgente (un CVE cuyo arreglo tiene menos de 7 días): se exime ESA
# versión, no el paquete, añadiendo `paquete@x.y.z` a minimumReleaseAgeExclude
# con una línea de comentario encima: fecha, motivo (GHSA/CVE) y cuándo se
# quita (al cumplir los 7 días). Nunca se baja minimumReleaseAge para eso.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@saastro-io/*"
  # 24-oct-2026, al subir la cuarentena a 7 días: versiones que YA estaban en
  # el lock (las metió #60 el 22-oct, astro 7.4.2 por pnpm audit) y que tienen
  # menos de 7 días. Sin eximirlas, todo `pnpm install` que resuelva falla.
  # Quitar a partir del 29-oct-2026 (la más nueva, astro, es del 21-oct).
  - "@astrojs/markdown-satteri@0.4.5"
  - "@astrojs/mdx@8.1.1"
  - "@astrojs/prism@4.1.1"
  - "@astrojs/telemetry@3.4.1"
  - "@oxc-project/types@0.155.0"
  - "@rolldown/binding-android-arm-eabi@1.2.15"
  - "@rolldown/binding-android-arm64@1.2.15"
  - "@rolldown/binding-darwin-arm64@1.2.15"
  - "@rolldown/binding-darwin-x64@1.2.15"
  - "@rolldown/binding-freebsd-x64@1.2.15"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.15"
  - "@rolldown/binding-linux-arm64-gnu@1.2.15"
  - "@rolldown/binding-linux-arm64-musl@1.2.15"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.15"
  - "@rolldown/binding-linux-s390x-gnu@1.2.15"
  - "@rolldown/binding-linux-x64-gnu@1.2.15"
  - "@rolldown/binding-linux-x64-musl@1.2.15"
  - "@rolldown/binding-openharmony-arm64@1.2.15"
  - "@rolldown/binding-win32-arm64-msvc@1.2.15"
  - "@rolldown/binding-win32-x64-msvc@1.2.15"
  - "@shikijs/vscode-textmate@10.1.0"
  - "astro@7.4.2"
  - "postcss@8.5.31"
  - "rolldown@1.2.15"
  - "tinyps@0.5.1"
  - "undici@8.12.3"
  - "vite@8.3.5"
