# pnpm workspace config — replaces the "workspaces" field the root
# package.json used under Bun. Same globs, so resolution is identical.
packages:
  - "packages/*"
  - "apps/*"

# The only two deps in the graph that declare install/postinstall scripts.
# pnpm 10 blocks build scripts by default; both are trusted and ship
# platform binaries, so we allow-list them explicitly.
# (Locally the global ~/.npmrc `ignore-scripts=true` still wins — this is
# what makes CI / CF Pages builds run them.)
onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - sharp

# Parches de seguridad para dependencias TRANSITIVAS (Dependabot, oct-2026).
# Cada selector va acotado por arriba y por abajo al tramo vulnerable, y el
# destino es un caret dentro de la MISMA mayor: ninguno cruza de mayor. Ninguno
# toca dependencias que los bloques del registry declaren (`@base-ui/react`,
# `lucide-react`…): todo es tooling de build/test/docs.
overrides:
  "proxy-addr@>=1.1.0 <2.0.8": ^2.0.8
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ^1.31.0
  "undici@>=7.0.0 <7.29.1": ^7.29.1
  "brace-expansion@>=1.0.0 <1.1.21": ^1.1.21
  "brace-expansion@>=5.0.0 <5.0.12": ^5.0.12
  "devalue@>=5.0.0 <5.9.3": ^5.9.3
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  "sharp@>=0.35.0 <0.35.5": ^0.35.5
  "fast-uri@>=3.0.0 <3.1.8": ^3.1.8
  "ip-address@>=10.0.0 <10.7.1": ^10.7.1
  "smol-toml@>=1.0.0 <1.9.0": ^1.9.0
