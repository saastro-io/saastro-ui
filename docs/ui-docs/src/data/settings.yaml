site:
  name: "Saastro UI"
  site: "https://ui.saastro.io"
  base: "/"
  trailingSlash: "never"
  googleSiteVerificationId:
  favicon:
    colors:
      icon: "#00a897"
      theme: "#00a897"

i18n:
  language: "en"
  textDirection: "ltr"

metadata:
  title:
    default: "Saastro UI"
    template: "%s | Saastro UI"
  description: "Open-source landing page blocks for Astro. Install via shadcn CLI."
  robots:
    index: true
    follow: true
  openGraph:
    type: "website"
    site_name: "Saastro UI"
    images: []
  twitter:
    card: "summary_large_image"

apps:
  blog:
    isEnabled: false
    list:
      pathname: "blog"
      robots: { index: true, follow: true }
    category: { pathname: "category" }
    tag: { pathname: "tag" }
    post:
      permalink: "/blog/%slug%"
      robots: { index: true, follow: true }
    postsPerPage: 6
ui:
  theme: "system"

analytics:
  googleAnalytics:
    id: ""
  googleTagManager:
    id: ""

cookieConsent:
  privacyPolicyUrl: "/privacy"
  position: "bottom"
  theme: "auto"
