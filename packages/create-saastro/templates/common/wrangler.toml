# Cloudflare Workers configuration
# See: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "my-saastrocms-site"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Astro builds to this directory
main = "dist/_worker.js"
assets = { directory = "dist", binding = "ASSETS" }

# KV namespace for sessions (create with: wrangler kv namespace create SESSIONS)
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-kv-namespace-id"

# Optional: R2 bucket for media storage (create with: wrangler r2 bucket create media)
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "your-bucket-name"

# Environment variables (secrets should be set with: wrangler secret put SECRET_NAME)
[vars]
# GITHUB_OWNER = "your-username"
# GITHUB_REPO = "your-repo"
# GITHUB_BRANCH = "main"

# Development environment
[env.dev]
name = "my-saastrocms-site-dev"

# Preview/staging environment
[env.preview]
name = "my-saastrocms-site-preview"
